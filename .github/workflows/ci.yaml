name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  vuln:
    name: Vulnerability scan (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  web:
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type-check & build
        run: bun run build

  graph:
    name: Task graph & API contract integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate graph files
        run: python3 scripts/graph_status.py --check

      - name: Check generated API artifacts are fresh
        run: |
          python3 scripts/gen_api_routes.py --check
          python3 scripts/gen_api_client.py --check
          python3 scripts/check_openapi.py

  e2e:
    name: Dashboard E2E (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build gateway
        run: make build

      - name: Install dashboard dependencies
        working-directory: web
        run: bun install

      - name: Build dashboard
        working-directory: web
        run: bun run build

      - name: Install playwright browsers
        working-directory: web
        run: bunx playwright install --with-deps chromium

      - name: Run E2E journeys
        working-directory: web
        run: bun run e2e
        env:
          CI: true
