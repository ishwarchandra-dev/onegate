# OneGate task graph — Phase 6: Management API & Dashboard
phase: 6
name: dashboard
title: "Phase 6 — Management API & Dashboard UI"
status: pending
gate:
  - "OpenAPI spec is the contract; TS client generated from it"
  - "Core views shipped: providers, models & routing, keys, usage, logs, settings"
  - "Dashboard auth: login, sessions, CSRF; no secrets over the wire"
  - "Both LTR and RTL layouts verified"

nodes:
  - id: p6.api-spec
    title: "OpenAPI spec for management API (resources, pagination, error envelope)"
    owner: api-designer
    status: done
    depends_on: [p4.gate, p5.gate]
    deliverables:
      - "docs/api/openapi.yaml covering all dashboard resources"
    acceptance:
      - "Spec lints clean; every endpoint has auth class + rate-limit class"
    evidence:
      - "redocly lint docs/api/openapi.yaml — valid (recommended ruleset, 0 problems)"
      - "python3 scripts/check_openapi.py — 35 operations across 24 paths; all carry x-auth + x-rate-limit; classes auth/read/write/stream/probe defined in x-rate-limit-classes"
      - "go vet ./... + go test -count=1 ./... green; graph_status.py --check OK (10 graphs, 86 nodes)"

  - id: p6.api-impl
    title: "Management API handlers + generated TS client"
    owner: go-engineer
    status: done
    depends_on: [p6.api-spec]
    deliverables:
      - "internal/api handlers; codegen script for web client"
    acceptance:
      - "Handler conformance tests run against the spec (contract testing)"
    evidence:
      - "internal/api/spec_gen.go GENERATED from docs/api/openapi.yaml by scripts/gen_api_routes.py (35 routes); Register panics on spec/handler drift either direction; CI `make api-check` fails on stale artifacts"
      - "Contract tests (internal/api/api_test.go): TestSpecRoutesAllRegistered (35/35), TestAuthClassEnforcement (per-route 401 without/with wrong token, pass with token, public never 401), TestRateLimitWriteClass (30/min budget, 429 + envelope, window reset via injectable clock), envelope shape/content-type checks"
      - "Behavior tests (handlers_test.go): provider lifecycle (masked_key, no api_key echo, idempotent create, PATCH rotation semantics), SSRF-guarded probe against live httptest mock (per-protocol /models path + bearer; 401 detail surfaces), model replace validation (unknown provider 400), routing rules + health view, key show-once (raw never in list/get/patch; revoked key fails verify; revoke idempotent), usage summary/range/requests pagination (bucket-aligned), logs recent + filters, system status/config"
      - "scripts/gen_api_client.py -> web/app/lib/api/{types,client}.ts: typed TS client, 35 methods, ApiError envelope, CSRF header plumbing; bun run build + typecheck green"
      - "Full gate: go vet ./..., go test -count=1 ./... -race (21 packages ok), graph --check OK; live binary smoke test (healthz, 401 gate, provider CRUD, key mint, SSE 200)"
      - "Session ops (login/setup/logout/session) reserved in spec, answer 503 until p6.auth-sessions; admin-token auth (ONEGATE_ADMIN_TOKEN) live now"

  - id: p6.auth-sessions
    title: "Dashboard auth: login, session cookies, CSRF, logout"
    owner: security-engineer
    status: done
    depends_on: [p6.api-impl]
    deliverables:
      - "Session store, cookie hardening, CSRF middleware"
    acceptance:
      - "First-run setup flow creates admin; sessions expire; CSRF blocked in tests"
    evidence:
      - "internal/api/sessions.go: in-memory SessionManager (32-byte hex ids + per-session CSRF tokens, lazy expiry + sweep on create, no background goroutine); internal/api/sessions_handlers.go: setup-status/setup/login/logout/session per spec"
      - "internal/auth/password.go: PBKDF2-HMAC-SHA256 (stdlib crypto/pbkdf2, Go 1.24), 600k iterations per OWASP, parameter-aware verify, constant-time; BurnPasswordWork equalizes unknown-username timing (no user enumeration)"
      - "Storage migration 4 (admin_users) + AdminUserRepo; setup refuses after first admin (403)"
      - "Cookie hardening: HttpOnly + SameSite=Lax + Path=/ + Max-Age=TTL; Secure behind TLS/X-Forwarded-Proto; fresh session id per login (fixation defense)"
      - "CSRF middleware in API.wrap: session-authenticated mutations require X-CSRF-Token (constant-time); admin-token requests exempt by design; verified in tests (403 csrf_token_invalid without/wrong token, 201 with correct token)"
      - "Tests (sessions_test.go): TestFirstRunSetupFlow, TestLoginFlowAndCookieHardening (uniform 401, cookie flags, fresh id), TestCSRFBlockedForSessionMutations, TestSessionExpiry (clock-advanced 401), TestLogoutInvalidatesSession, TestLoginBruteForceLimited (429 within auth class), TestSetupStatusCountsAdmins"
      - "Live binary smoke: setup 201 + hardened cookie, session echoes CSRF, cookie-mutation without CSRF -> 403; caught and fixed nil-clock panic in NewSessionManager that unit tests missed"
      - "Full gate: go vet, go test -race (21 pkgs), graph --check, api-check all green"

  - id: p6.design-system
    title: "Dashboard design system: tokens, charts, empty/loading states"
    owner: design-engineer
    status: done
    depends_on: [p0.gate]
    deliverables:
      - "app.css token set, chart palette, skeleton components"
    acceptance:
      - "Dark/light parity; AA contrast; RTL-safe patterns documented"
    evidence:
      - "scripts/check_contrast.py — parses app.css, oklch->sRGB, verifies 56/56 committed pairings AA in BOTH modes (text >=4.5:1, chart series/ring >=3:1); token parity light<->dark enforced"
      - "web/app/app.css — full token set (status success/warning/destructive, 8-hue categorical chart palette + chart chrome tokens, skeleton token) with identical light/dark token names"
      - "web/app/components/{ui/skeleton,skeletons,states}.tsx — skeleton primitive + TableSkeleton/StatCardSkeleton/ChartSkeleton/FormSkeleton/LogStreamSkeleton/PageSkeleton + EmptyState/ErrorState/StreamGapIndicator; logical properties only; pulse animation (direction-neutral) disabled under prefers-reduced-motion"
      - "web/docs/design-system.md — token tables, chart language, density contract, dark/light parity rules, AA evidence table, RTL-safe pattern rules (logical properties, icon mirroring, LTR charts, .tnum)"
      - "cd web && bun run build && bun run typecheck — green (dashboard gate)"

  - id: p6.view-providers
    title: "Providers view: list, add/edit (masked keys), enable/disable, test connection"
    owner: frontend-engineer
    status: done
    depends_on: [p6.api-impl, p6.design-system]
    deliverables:
      - "Routes + components + optimistic updates"
    acceptance:
      - "Test connection surfaces per-protocol error detail"
    evidence:
      - "web/app/routes/providers.tsx: table with masked keys, add/edit dialog (api_key write-only, blank keeps credential), optimistic enable/disable with revert, delete"
      - "Test connection surfaces per-protocol error detail: probe renders ok+latency or the provider's own status + canonical error type (ProbeResult badge + title detail)"
      - "Session-gated shell (_dashboard.tsx) + login/first-run wizard (login.tsx) + singleton API client with CSRF plumbing (lib/api/index.ts)"
      - "bun run build + typecheck green"

  - id: p6.view-routing
    title: "Models & routing view: registry, fallback chains editor, health states"
    owner: frontend-engineer
    status: done
    depends_on: [p6.api-impl, p6.design-system]
    deliverables:
      - "Chain editor with drag ordering + validation"
    acceptance:
      - "Invalid chains rejected client and server side"
    evidence:
      - "web/app/routes/routing.tsx: model cards, per-model policy select (rule create/replace), targets table with circuit-health badges from GET /api/routing/health"
      - "Chain editor with ordered rows (move/remove/add); invalid chains rejected client-side (empty chain, unknown provider, blank fields, weight<1) AND server-side 400s rendered inline"
      - "Dangling provider references flagged inline"
      - "bun run build + typecheck green"

  - id: p6.view-keys
    title: "Virtual keys view: create (show-once), scopes, quotas, revoke"
    owner: frontend-engineer
    status: done
    depends_on: [p6.api-impl, p6.design-system]
    deliverables:
