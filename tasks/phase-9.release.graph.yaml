  - id: p9.changelog-v1
    title: "Changelog assembly + v1.0.0 release notes from graph history"
    owner: release-manager
    status: pending
    depends_on: [p9.build-matrix, p9.docker, p9.npx-launcher, p9.cli-polish, p9.user-docs]
    deliverables:
      - "CHANGELOG.md + release notes + upgrade guide"
    acceptance:
      - "Notes assembled from done-nodes; upgrade path from OmniRoute documented"

  - id: p9.gate
    title: "Phase 9 gate: v1.0.0 ship decision"
    owner: graph-master
    status: pending
    depends_on: [p9.embed-decision, p9.embed-pipeline, p9.build-matrix, p9.docker, p9.npx-launcher, p9.cli-polish, p9.user-docs, p9.changelog-v1]
