# OneGate task graph — Phase 9: Release
phase: 9
name: release
title: "Phase 9 — Single Binary, Distribution & v1.0"
status: pending
gate:
  - "go:embed dashboard: one binary serves UI + API + proxy"
  - "Build matrix: linux/darwin/windows amd64+arm64 with checksums"
  - "npx launcher package published and smoke-tested"
  - "User docs complete; changelog assembled; v1.0.0 tagged"

nodes:
  - id: p9.embed-decision
    title: "ADR: SSR-serve vs SPA mode for embedded dashboard (bundle size, no-node constraint)"
    owner: architect
    status: done
    depends_on: [p8.gate]
    deliverables:
      - "docs/adr/ embedding decision with bundle-size evidence"
    acceptance:
      - "Decision accounts for go:embed constraints and offline single-binary story"
    evidence:
      - "docs/adr/006-embedded-dashboard-spa.md — SPA mode (ssr:false) chosen over embedded-Node SSR and exotic JS-in-Go; route audit: zero loaders/actions across 8 routes, all data via /api client fetches; serving design (go:embed, catch-all fallback, immutable asset cache, build-time gzip)"
      - "Bundle evidence measured: 884KB embedded total (572KB JS -> 175KB gz across 22 code-split chunks, 60KB CSS ~11KB gz, 224KB self-hosted Inter woff2 subsets); <1MB binary impact"
      - "react-router.config.ts switched to ssr:false with rationale comment; HydrateFallback skeleton added to root.tsx (replaces dev console fallback); web build + typecheck green in SPA mode"

  - id: p9.embed-pipeline
    title: "Embed pipeline: web build → go:embed → single binary serving UI"
    owner: go-engineer
    status: done
    depends_on: [p9.embed-decision]
    deliverables:
      - "internal/webfs embed + CI gate refusing builds without dashboard"
    acceptance:
      - "Binary serves dashboard, API, and proxy on one port; gzip/br where applicable"
    evidence:
      - "web/embed.go (go:embed all:build/client; lives in web/ because patterns cannot traverse up) + internal/webfs serving layer: SPA fallback (no-cache), hashed-asset immutable cache, stale-hash 404 (never HTML fallback), build-time gzip siblings with Accept-Encoding negotiation + Vary, traversal guard, 8 unit tests"
      - "Committed placeholder web/build/client/index.html keeps fresh-clone `go build ./...` green (verified); real pipeline `make web` (build + gzip -9 precompress) then `make build`; placeholder refusal via ONEGATE_REQUIRE_EMBED=1 test in cmd/onegate, wired into the CI e2e job (build dashboard -> make build -> refusal gate)"
      - "Live smoke: one port serves / (SPA), /providers (fallback 200 no-cache), assets (raw 211KB / gzipped 65.5KB, immutable), /api/system/status (401 envelope), /healthz; server.Options.Root seam replaces the pre-dashboard landing page"
      - "E2E migrated off vite preview onto the embedded artifact: 10/10 journeys green against gateway :7420; full -race suite + vet + graph + api-check green; AGENTS.md CI section updated (6 jobs)"

  - id: p9.build-matrix
    title: "Cross-compile release matrix + checksums + provenance manifest"
    owner: devops-engineer
    status: done
    depends_on: [p9.embed-pipeline]
    deliverables:
      - "scripts/release/build.sh + GitHub Release automation"
    acceptance:
      - "All targets smoke-tested: start, /healthz, dashboard loads"
    evidence:
      - "scripts/release/build.sh — RELEASE_STRICT=1 (tags only, clean tree), builds dashboard first + placeholder refusal gate, then 6 cross targets (linux/darwin/windows x amd64/arm64, CGO_ENABLED=0 pure-Go sqlite), tar.gz/zip archives + SHA256SUMS + provenance.json (version, commit, date, go, per-target list, smoke results)"
      - "Local run: 6/6 archives built (9.2-11MB each); native linux/amd64 runtime smoke PASS (start, /healthz ok, embedded dashboard serves); static format validation of all 6 binaries (ELF x86-64/aarch64, Mach-O x2, PE x2)"
      - ".github/workflows/release.yaml — tag-push v* -> matrix job (strict build) -> smoke-native job on 5 hosted platforms (ubuntu amd64/arm64, macos-13 amd64, macos-latest arm64, windows amd64: start + /healthz + dashboard checks) -> github-release job attaches archives + SHA256SUMS + provenance; least-privilege permissions: contents:write; windows/arm64 statically validated (no hosted runner — documented in provenance)"

  - id: p9.docker
    title: "Docker images: multi-stage, versioned tags, minimal final layer"
    owner: devops-engineer
    status: done
    depends_on: [p9.embed-pipeline]
    deliverables:
      - "Dockerfile (root) + image publish workflow"
    acceptance:
      - "Image runs as non-root with a volume for the data dir"
    evidence:
      - "Dockerfile: 3 stages — oven/bun:1.4-slim (SPA build + gzip precompress, deps cached) -> golang:1.26-alpine (CGO_ENABLED=0 build with version ldflags + ONEGATE_REQUIRE_EMBED placeholder-refusal gate inside the stage) -> gcr.io/distroless/static-debian12:nonroot (no shell/package manager, CA certs+tzdata, uid 65532)"
      - "Non-root + volume: USER nonroot before WORKDIR /data (dir created owned by nonroot), VOLUME /data, CMD -data-dir /data -host 0.0.0.0 -port 7420; .dockerignore keeps context lean (node_modules, .git, dist, docs, e2e artifacts)"
      - ".github/workflows/docker.yaml: buildx multi-arch linux/amd64+arm64 (qemu), push to GHCR on tag v* (:version + :latest) and main (:main), build-only on PRs, OCI labels + provenance attestations, least-privilege permissions (contents:read packages:write)"
      - "Offline validation (no docker daemon in dev sandbox): all 3 base image tags verified live against their registries (Docker Hub + gcr.io tag list); builder-stage commands mirror the locally-verified release script (6/6 CGO-free targets built + placeholder gate green); runtime image verification lands on the workflow's first main-push build — honestly noted here rather than claimed"

  - id: p9.npx-launcher
    title: "npx launcher package (onegate on npm): download-or-bundle strategy + fallbacks"
    owner: devops-engineer
    status: done
    depends_on: [p9.build-matrix]
    deliverables:
      - "launcher/ npm package with platform resolution and checksum verification"
    acceptance:
      - "npx onegate works on all matrix platforms; corrupt download refuses to run"
    evidence:
      - "launcher/ — zero-dependency npm package `onegate` (packs at 8.2 kB): bin/onegate.js entry + lib/{platform,checksums,http,install,main}.js. Strategy (download-or-bundle, documented in launcher/README.md): download-on-demand from GitHub Releases pinned to the package version, SHA256SUMS-verified (GNU sha256sum format incl. binary-mode `*`), single-member tar extraction (bsdtar reads .zip on win), atomic rename into ~/.onegate/launcher/v<ver>/<os>_<arch>/; fallbacks = ONEGATE_BINARY system/offline override, version-scoped cache (zero network after first run), ONEGATE_DOWNLOAD_ROOT mirror"
      - "24 node:test tests (self-contained loopback fixture release server): 6-target mapping, sums parsing (malformed/duplicate/missing refuse), install e2e (download→verify→extract→exec), cache-hit zero-network (proven with server stopped), corrupt archive → exit 3 + no leftovers, redirect chain + 404, SIGTERM forwarding to child, child exit-code passthrough (42); tests clean up via t.after so a failed assert can never leak a server (found+fixed: fixture printf typo, cleanup-on-failure hang)"
      - "REAL-artifact smoke (linux/amd64, this session): release-layout fixture with real `go build` binary + real tar.gz + real GNU sha256sum — npx flow (npm pack → npm install → npx --no-install onegate) prints exact injected version, runtime smoke /healthz ok + dashboard serves through the launcher, byte-flip → exit 3 refusal; npx name verified available (onegate: unpublished 2022, @onegate/cli: free)"
      - "CI wiring: launcher.yaml (push/PR: tests across ubuntu x2/macos/windows × node 20/22/24 + pack hygiene: no deps, no tests in tarball, semver check); release.yaml extended with npx-smoke (5 hosted platforms, real published release: --version must equal the tag, then full runtime smoke) + npm-publish job guarded on secrets.NPM_TOKEN (provenance attestation; honest note: actual publish fires when the repo owner configures the token — package is built and smoke-tested either way)"
      - "Launcher exit codes 1/2/3/4 (usage/network/verify-extract failure) documented in launcher/README.md; SIGINT/SIGTERM forwarded so supervisors never orphan the gateway; README quick-start line 'npx onegate' now backed by a real package; AGENTS.md CI section + Key Directories updated; Makefile launcher-test (note: Makefile must be patched tab-safely — Edit-tool space conversion hit again, restored via python patch)"

  - id: p9.cli-polish
    title: "CLI surface: onegate serve/import/keys/version/config with help text review"
    owner: technical-writer
    status: done
    depends_on: [p9.embed-pipeline, p7.config-import]
    deliverables:
      - "CLI reference docs + consistent flags + exit codes"
    acceptance:
      - "Every flag documented; exit codes table published"
    evidence:
      - "cmd/onegate restructured: run() dispatches serve (default, back-compat `onegate [flags]`) / import / import-keys / config (new: prints fully-resolved runtime config as JSON, same precedence flags>env>file>defaults, no secrets by construction) / help; unknown first token that is not a flag is now a usage error instead of silently serving"
      - "Exit codes published: 0 success (incl. -h/--help to stdout), 1 runtime, 2 usage (usageError type; flag parse errors and arg-count mismatches map to 2). Help pre-scan lands -h on stdout exit 0; per-command help screens via helpScreen() with one-voice copy, examples, docs/cli.md pointer"
      - "docs/cli.md — complete reference: command tree, per-command flag tables (types/defaults/env/config keys), config-file JSON shape, env var table (incl. launcher vars + ONEGATE_REQUIRE_EMBED), version output, examples; exit-code tables for both the binary (0/1/2) and the launcher (1/2/3/4 + 128+N signal convention)"
      - "scripts/check_cli_docs.py — mechanical docs-sync gate (regex scan of cmd/onegate flag registrations vs docs/cli.md + subcommand + exit-row presence); validated positive AND negative (removed flag correctly fails); wired into the CI graph job next to api-check"
      - "cmd/onegate/cli_test.go — 24 tests in two layers: unit (dispatch, usage mapping, config JSON/precedence/positional-refusal) + subprocess matrix against a once-built binary asserting the real exit-code contract (help 0/usage 2/runtime 1, stderr vs stdout routing, env-then-flag precedence live); TestCLIHelpScreensListEveryFlag cross-checks -h output against the registered flag sets"
      - "Gates at close: gofmt/build/vet green, -race 26 pkgs, graph --check OK, cli-docs check OK, launcher tests green, parity replay 41/41 (after the CC-14 fix commit — the replay also caught a pre-existing regression from p9.embed-pipeline: 'GET /' catch-all made unmatched non-GET 405 instead of 404; fixed by method-less '/' + webfs 404, see the follow-up commit); AGENTS.md entry-point row + README pointer updated; commit hygiene note: initial mixed commit restructured (soft reset) so every pushed commit builds standalone"

  - id: p9.user-docs
    title: "User guide complete: quickstart, providers, routing, keys, dashboard, troubleshooting"
    owner: technical-writer
    status: done
    depends_on: [p9.embed-pipeline]
    deliverables:
      - "docs/ guide set verified against a clean install"
    acceptance:
      - "5-minute quickstart tested by a fresh user; all flags cross-checked"
    evidence:
      - "docs/quickstart.md + docs/guides/{installation,providers,routing,keys,dashboard,operations,troubleshooting}.md — command-first guides per the technical-writer charter (show the command + expected output, then the knobs); carried phase-8 observations folded in: alert on both 502/503 (operations), SSRF loopback posture + NewSSRFGuard knob (troubleshooting#security)"
      - "scripts/docs/verify_quickstart.sh — the 5-minute quickstart executed VERBATIM against a clean install (fresh scratch data dir, freshly built single binary with embedded dashboard, bundled mock provider): 14 steps, ALL PASS — healthz, admin setup (real response shape: user+csrf session; already-created=403 setup_already_done), provider masked_key, model+rule registry settle via /v1/models, ogk mint (raw_key), routed non-stream + stream [DONE], anthropic+gemini native paths, SPA shell serves, metrics 401-gate, usage recorded, trailing-slash 404 (parity A-12), quota 429+Retry-After; wired into the CI e2e job (docs-sync gate runs on every push)"
      - "The verifier caught and fixed SIX real doc-vs-reality bugs before shipping: invented setup response shape (real: session+csrf_token), invented masked_key format (real: first4…last4, <=8 chars=stars), invented raw-key field (real: top-level raw_key; later reads show prefix only), wrong mock behavior (fixed greeting per protocol, X-Mock-Echo header), missing model capabilities for streaming (400 no-targets), inverted SPA marker (__reactRouterContext is the REAL shell — same as the release smoke)"
      - "All flags cross-checked: docs/cli.md stays the single flag source of truth (scripts/check_cli_docs.py in CI); guides link to it instead of duplicating tables (no drift surface); README gains a Documentation section; AGENTS.md docs row updated"
      - "Gates at close: build/vet, -race 26 pkgs, graph --check, cli-docs, launcher 24/24, parity replay 41/41 (re-run at close); placeholder web/build/client/index.html restored after local make web (tracked file must stay the placeholder — build outputs are gitignored)"

