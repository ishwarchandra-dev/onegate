    evidence:
      - "web/app/routes/keys.tsx: table (prefix, limits summary, status, last used), mint dialog, revoke (confirm), delete (confirm, distinct from revoke)"
      - "Show-once dialog: raw ogk- key displayed EXACTLY ONCE with copy button + unrecoverable warning; raw key never in list/detail after mint"
      - "bun run build + typecheck green"

  - id: p6.view-usage
    title: "Usage analytics view: requests, tokens, cost, latency charts over time"
    owner: frontend-engineer
    status: done
    depends_on: [p6.api-impl, p5.rollups]
    deliverables:
      - "Time-range selectors, per-model/provider breakdowns, CSV export"
    acceptance:
      - "Charts stream from rollup API; empty and error states designed"
    evidence:
      - "web/app/routes/usage.tsx: summary cards (requests/tokens/cost/error-rate) from /api/usage/summary; charts stream from /api/usage/range (requests vs errors, tokens, cost)"
      - "Zero-dependency SVG BarChart with design-system palette tokens, series toggles, accessible ChartTable fallback; missing buckets zero-filled"
      - "Time-range selectors (24h/7d/30d), recent requests table, CSV export"
      - "Empty and error states designed (empty-window panel, inline error)"
      - "bun run build + typecheck green"

  - id: p6.view-logs
    title: "Live logs view: SSE stream with filters and trace details"
    owner: frontend-engineer
    status: done
    depends_on: [p6.api-impl, p5.live-logs]
    deliverables:
      - "Live tail + pause + filter; trace drill-down drawer"
    acceptance:
      - "Backpressure drops visible as a gap indicator, not a freeze"
    evidence:
      - "web/app/routes/logs.tsx: EventSource live tail + ring snapshot seed; live/disconnected badge; level + trace filters reconnect the stream"
      - "Pause keeps the connection but stops rendering (never a freeze); bounded 500-entry buffer"
      - "Backpressure drops render as StreamGapIndicator rows (SSE 'dropped' events) — a visible gap, per the acceptance criterion"
      - "Trace drill-down drawer (entry detail + attrs JSON)"
      - "settings.tsx read-only config view completes the gate's settings view"
      - "bun run build + typecheck green"

  - id: p6.e2e-dashboard
    title: "Dashboard E2E suite (playwright) against seeded gateway"
    owner: qa-engineer
    status: done
    depends_on: [p6.view-providers, p6.view-routing, p6.view-keys, p6.view-usage, p6.view-logs, p6.auth-sessions]
    deliverables:
      - "E2E specs covering the primary user journeys"
    acceptance:
      - "Journeys green in CI; no route ships untested"
    evidence:
      - "web/e2e/journeys.spec.ts: 10/10 green locally (45s) — first-run setup, login (wrong password + success), providers (add, masked key never raw, probe ok + per-protocol 401 detail after key rotation), routing (client-side invalid-chain rejection + valid chain + health badge), keys (mint show-once + copy + raw never in list), usage (designed empty state), logs (live badge, pause holds), settings, RTL mirror pass (no horizontal overflow on all 6 views)"
      - "web/e2e/setup.spec.ts + helpers.ts: one-time auth via storageState (avoids the auth-class 10/min budget); serial workers (shared gateway state)"
      - "CI e2e job (.github/workflows/ci.yaml): builds gateway (make build) + dashboard, installs chromium, runs bun run e2e — journeys green in CI per acceptance"
      - "E2E found and fixed a real gateway bug: SSE stream buffered by reverse proxies when the first flush carries no body bytes — LogHub now emits a ':connected / retry: 3000' greeting frame (also aligned the dropped-event payload key to the spec's count)"
      - "Gates: playwright 10/10, go vet, go test -race (observability+api), graph --check, web typecheck 0 errors"

