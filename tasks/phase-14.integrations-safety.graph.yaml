  - id: p14.webhooks
    title: "Webhooks: events, delivery, replay"
    owner: go-engineer
    status: pending
    depends_on: [p12.gate]
    deliverables:
      - "Events: request.completed, quota.exceeded, key.revoked, provider.unhealthy"
      - "HMAC-signed payloads; bounded retry with backoff; delivery log + replay UI"
    acceptance:
      - "Delivery + retry + replay verified in e2e; secrets never in payloads"

  - id: p14.guardrails
    title: "Guardrails: injection scanner + credential masking"
    owner: security-engineer
    status: pending
    depends_on: [p12.gate]
    deliverables:
      - "Opt-in prompt-injection heuristic scanner (per model/key), verdict logged, configurable action (log|block)"
      - "Credential masking: redact API-key-shaped strings in both directions"
    acceptance:
      - "Red-team corpus: known injection patterns detected (target recall documented); zero false blocks on clean corpus"
      - "Bypass scopes for admin keys; threat-model updated"

  - id: p14.gate
    title: "Phase 14 gate: integrations & safety accepted"
    owner: code-reviewer
    status: pending
    depends_on: [p14.mcp, p14.webhooks, p14.guardrails]
    deliverables:
      - "docs/gates/phase-14.md with verdict"
    acceptance:
      - "MCP e2e green; webhook replay green; guardrail corpus results recorded; graph --check green"
