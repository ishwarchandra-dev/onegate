# OneGate task graph — Phase 1: Configuration & Storage Foundation
phase: 1
name: foundation
title: "Phase 1 — Configuration & Storage Foundation"
status: pending
gate:
  - "Config loads from file + env with schema validation and hot reload"
  - "SQLite schema v1 migrated up/down on fresh and upgraded installs"
  - "Structured logging with redaction middleware proven by tests"
  - "All foundation tests pass with -race"

nodes:
  - id: p1.domain-types
    title: "Canonical domain types (Provider, Model, VirtualKey, RequestRecord, Usage)"
    owner: architect
    status: pending
    depends_on: [p0.gate]
    deliverables:
      - "internal/domain/*.go with package doc"
    acceptance:
      - "Types carry JSON tags matching the OmniRoute v3.8.52 wire shapes"
      - "No imports outside stdlib; zero behavioral logic"

  - id: p1.config-load
    title: "Config loading: file (~/.onegate + cwd), env override, schema validation"
    owner: go-engineer
    status: pending
    depends_on: [p1.domain-types]
    deliverables:
      - "internal/config loader + validator + error messages"
      - "Config reference doc generated from schema"
    acceptance:
      - "Invalid config fails with line-precise errors"
      - "Precedence: flags > env > file > defaults, proven by tests"

  - id: p1.config-hotreload
    title: "Config hot reload (SIGHUP + file watch) with change events"
    owner: go-engineer
    status: pending
    depends_on: [p1.config-load]
    deliverables:
      - "Reload pipeline publishing typed change events"
    acceptance:
      - "Listeners receive old/new values; failed reload keeps last-good config"

  - id: p1.storage-schema
    title: "SQLite schema v1: providers, models, keys, routing rules, requests, rollups"
    owner: storage-engineer
    status: pending
    depends_on: [p1.domain-types]
    deliverables:
      - "internal/storage: open, migrate (forward-only), close; WAL tuning"
    acceptance:
      - "Fresh install and upgrade paths tested; migrations transactional"
      - "Concurrent readers + single writer pattern documented and tested"

  - id: p1.storage-repos
    title: "Repository layer over schema v1 (CRUD for each aggregate)"
    owner: storage-engineer
    status: pending
    depends_on: [p1.storage-schema]
    deliverables:
      - "Repo structs with table-driven tests (in-memory SQLite)"
    acceptance:
      - "All CRUD round-trips; cursor pagination for listing repos"

  - id: p1.logging
    title: "slog setup: levels, redaction middleware, trace-ID field convention"
    owner: observability-engineer
    status: pending
    depends_on: [p1.domain-types]
    deliverables:
      - "internal/observability/logging.go + redaction tests"
    acceptance:
      - "Key/token values redacted in every log sink test case"
      - "Trace IDs attach via context and appear in output"

  - id: p1.secrets
    title: "Master secret & provider-key encryption at rest (AES-GCM)"
    owner: security-engineer
    status: pending
    depends_on: [p1.storage-schema]
    deliverables:
      - "internal/auth/crypto: key derivation, encrypt/decrypt, key file handling"
    acceptance:
      - "Round-trip tests; wrong-master-key yields clear error, never data"
      - "Key file created 0600; docs cover OS keychain option"

  - id: p1.gate
    title: "Phase 1 gate"
    owner: graph-master
    status: pending
    depends_on: [p1.domain-types, p1.config-load, p1.config-hotreload, p1.storage-schema, p1.storage-repos, p1.logging, p1.secrets]
    deliverables:
      - "Gate report in worklog"
    acceptance:
      - "All gate criteria verified with evidence"
