nodes:
  - id: p14.mcp
    title: "MCP server: gateway management as tools"
    owner: api-designer
    status: pending
    depends_on: [p12.gate]
    deliverables:
      - "internal/mcp: stdio + HTTP streamable transports; tool schema generated from OpenAPI where possible"
