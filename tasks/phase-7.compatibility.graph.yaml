# OneGate task graph — Phase 7: Compatibility & Migration
phase: 7
name: compatibility
title: "Phase 7 — OmniRoute v3.8.52 Parity & Migration"
status: pending
gate:
  - "Parity checklist: 100% of blocker rows green, cosmetic rows triaged"
  - "Traffic replay diff harness clean on captured corpus"
  - "onegate import migrates a reference OmniRoute install (dry-run + apply)"
  - "Parity report published with per-area sign-offs"

nodes:
  - id: p7.parity-checklist
    title: "Full parity checklist from OmniRoute v3.8.52 source & traffic captures"
    owner: compatibility-auditor
    status: done
    depends_on: [p6.gate]
    deliverables:
      - "docs/compat/checklist.md: endpoints, headers, errors, events, config, CLI"
    acceptance:
      - "Every row has: legacy behavior, OneGate status, evidence link"
    evidence:
      - "docs/compat/checklist.md — 79 rows across 7 areas (A endpoints, B headers, C errors top-20, D stream events, E config, F CLI, G cross-protocol); every row carries legacy behavior + status + evidence link (test/fixture/code/corpus CC-nn)"
      - "16 blocker gaps catalogued, all traced to two root causes: unwired data plane (StaticResolver in cmd/onegate) and missing surfaces (/v1/models, quota Retry-After, upstream_authentication code, import CLI)"

  - id: p7.capture-corpus
    title: "Captured traffic corpus (anonymized) for replay diffing"
    owner: compatibility-auditor
    status: done
    depends_on: [p7.parity-checklist]
    deliverables:
      - "Fixture corpus: requests/responses/SSE transcripts per protocol"
    acceptance:
      - "Corpus covers top-20 error cases and all stream event orders"
    evidence:
      - "test/parity/corpus.json — 41 cases (CC-01..CC-41), 18 seeded models, 10 seeded keys, 4 providers; expected transcripts authored from the documented wire contracts (protocol-mappings.md, adapter codecs)"
      - "internal/mockprovider/scenarios.go — model-driven deterministic upstream scenarios (sc-500/401/429rr/529/ctxlen/stall/delay/midstream/badjson/toolstream/thinkstream/ping); 12 unit tests in scenarios_test.go"
      - "test/parity/README.md — coverage matrix: top-20 error rows C-1..C-23 all mapped, stream orders D-1..D-10 all mapped"

  - id: p7.replay-harness
    title: "Replay diff harness: corpus → OneGate vs OmniRoute, byte/event diff"
    owner: qa-engineer
    status: done
    depends_on: [p7.capture-corpus]
    deliverables:
      - "scripts/parity/replay.py + normalized diff reporter"
    acceptance:
      - "Zero unexplained diffs on corpus; diffs classified blocker/cosmetic"
    evidence:
      - "scripts/parity/replay.py — stdlib-only harness: builds binaries, boots 2 mock providers + gateway, seeds via management API (rate-limit window aware), replays corpus (sequential/concurrent/abort steps), wildcard-normalized JSON + SSE frame diffing, post-checks against /api/requests, markdown report"
      - "Baseline run 2026-10-09: 9/41 pass, 32 blocker diffs, 0 cosmetic — every diff maps to a catalogued checklist gap (report docs/reports/parity-replay.md); pass set = ingest-level auth/validation rows (C-1..C-5, C-13, C-15, A-10, A-12), confirming the two-root-cause analysis"
      - "mockprovider gained GET /healthz for orchestration"

  - id: p7.parity-fixes
    title: "Parity fix cycle: resolve blockers surfaced by the harness"
    owner: go-engineer
    status: pending
    depends_on: [p7.replay-harness]
    deliverables:
      - "Fixes with regression tests per checklist row"
    acceptance:
      - "Each fix links the checklist row it closes"

  - id: p7.config-import
    title: "Import: omniroute.json → OneGate config + provider settings"
    owner: migration-engineer
    status: pending
    depends_on: [p7.parity-checklist]
    deliverables:
      - "onegate import --dry-run/--apply with diff report"
    acceptance:
      - "Idempotent; legacy install untouched; unmapped fields reported"

  - id: p7.data-import
    title: "Import: virtual keys, routing rules, usage history"
    owner: migration-engineer
    status: pending
    depends_on: [p7.config-import]
    deliverables:
      - "Key re-hash handling, rule translation, aggregate-preserving usage import"
    acceptance:
      - "Reference install imports 100% of mappable data with a skip report"

  - id: p7.parity-report
    title: "Parity report & sign-offs per area (proxy, routing, keys, config, CLI)"
    owner: compatibility-auditor
    status: pending
    depends_on: [p7.parity-fixes, p7.data-import]
    deliverables:
      - "docs/compat/report-phase7.md"
    acceptance:
      - "Blocker count zero; cosmetic items have task nodes or waivers"

  - id: p7.gate
    title: "Phase 7 gate"
    owner: graph-master
    status: pending
    depends_on: [p7.parity-checklist, p7.capture-corpus, p7.replay-harness, p7.parity-fixes, p7.config-import, p7.data-import, p7.parity-report]
    deliverables:
      - "Gate report"
    acceptance:
      - "All gate criteria verified"
