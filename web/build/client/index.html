<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OneGate — dashboard not built</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #3f3f46;
        background: #fafafa;
      }
      @media (prefers-color-scheme: dark) {
        body { color: #d4d4d8; background: #18181b; }
        code { color: #a7f3d0; }
      }
      main { max-width: 32rem; padding: 2rem; text-align: center; }
      h1 { font-size: 1.25rem; margin: 0 0 1rem; }
      p { margin: 0.5rem 0; }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.875em;
        background: rgba(127, 127, 127, 0.125);
        padding: 0.15em 0.4em;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>OneGate</h1>
      <p>This binary was built without the dashboard.</p>
      <p>
        Build the SPA and rebuild the binary:
        <code>make web &amp;&amp; make build</code>
      </p>
      <p>The API (<code>/api</code>) and proxy (<code>/v1</code>) endpoints are unaffected.</p>
    </main>
  </body>
</html>
