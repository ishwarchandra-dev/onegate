name: Docker

# Image publish (p9.docker): multi-arch (linux/amd64+arm64) images to
# GHCR, distroless runtime, versioned tags.
#   - tag push v*  -> ghcr.io/<repo>/onegate:<version> + :latest
#   - push to main -> ghcr.io/<repo>/onegate:main
#   - PRs          -> build only (no push), keeps the Dockerfile honest.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          image="${REGISTRY}/${IMAGE,,}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "tags=${image}:${GITHUB_REF_NAME},${image}:latest" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" == "main" ]]; then
            echo "tags=${image}:main" >> "$GITHUB_OUTPUT"
          else
            echo "tags=" >> "$GITHUB_OUTPUT"
          fi

      - name: Export build date
        id: date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build (and push on main/tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.tags.outputs.tags != '' }}
          tags: ${{ steps.tags.outputs.tags }}
          provenance: true
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.date.outputs.date }}
          labels: |
            org.opencontainers.image.title=OneGate
            org.opencontainers.image.description=Single-binary LLM gateway with embedded dashboard
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
            org.opencontainers.image.licenses=MIT
